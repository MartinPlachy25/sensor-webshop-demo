<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AI 3D test – M20W</title>
  <style>
    :root { --bg: #18181b; --ink: #f4f4f5; --muted: #a1a1aa; --red: #e3101e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
    .stage { position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .ref { display: grid; place-items: center; background: #fff; }
    .ref img { max-width: 80%; max-height: 80vh; }
    .note { position: absolute; left: 24px; top: 20px; max-width: 30rem; }
    .note b { display: block; font-size: 1.25rem; font-weight: 600; }
    .note span { color: var(--muted); font-size: 0.875rem; }
    .tabs { position: absolute; left: 24px; bottom: 24px; display: flex; gap: 6px; }
    .tabs button { font: inherit; color: var(--ink); background: #27272a; border: 1px solid #3f3f46; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .cap { position: absolute; right: 24px; top: 20px; color: #52525b; font-size: 0.875rem; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh 40vh; } }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<main>
  <div class="stage">
    <canvas id="c"></canvas>
    <p class="note"><b>AI test: HIKMICRO M20W</b><span>Shape generated by AI (Hunyuan3D) from two HIKMICRO product renders; the photos are projected onto it. Drag to turn.</span></p>
    <div class="tabs" role="group" aria-label="Look">
      <button type="button" data-look="photo" aria-pressed="true">With photos</button>
      <button type="button" data-look="clay" aria-pressed="false">Shape only</button>
    </div>
  </div>
  <div class="ref"><img src="M20W-1.png" alt="HIKMICRO M20W product render"><span class="cap" style="position:absolute">Original render by HIKMICRO</span></div>
</main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x18181b);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = !q.has('still');
controls.autoRotateSpeed = 1.2;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 2.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8); rim.position.set(-3, 1, -2); scene.add(rim);

// alpha bounding box of a product render, as uv rectangle (0..1)
function alphaBox(img) {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, s, s);
  const d = x.getImageData(0, 0, s, s).data;
  let x0 = s, y0 = s, x1 = 0, y1 = 0;
  for (let y = 0; y < s; y++) for (let i = 0; i < s; i++) if (d[(y * s + i) * 4 + 3] > 20) { x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return new THREE.Vector4(x0 / s, 1 - (y1 + 1) / s, (x1 + 1) / s, 1 - y0 / s); // uMin, vMin, uMax, vMax
}
const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });

const [imgF, imgS, gltf] = await Promise.all([loadImg('M20W-1.png'), loadImg('M20W-Left.png'), new GLTFLoader().loadAsync('../assets/models/m20w-ai-shape.glb')]);
const texOf = (img) => { const t = new THREE.Texture(img); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.needsUpdate = true; return t; };

const model = gltf.scene;
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
model.position.sub(center);
const pivot = new THREE.Group(); pivot.add(model); scene.add(pivot);

const sideSign = Number(q.get('side') || 1), frontSign = Number(q.get('front') || 1);
const uniforms = {
  tF: { value: texOf(imgF) }, tS: { value: texOf(imgS) },
  bF: { value: alphaBox(imgF) }, bS: { value: alphaBox(imgS) },
  bMin: { value: box.min.clone() }, bMax: { value: box.max.clone() },
  sides: { value: new THREE.Vector2(sideSign, frontSign) }, photo: { value: 1 },
};
const mat = new THREE.MeshPhysicalMaterial({ color: 0x232326, roughness: 0.55, metalness: 0.05, clearcoat: 0.25, clearcoatRoughness: 0.5 });
mat.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, uniforms);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vOP; varying vec3 vON;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOP = position; vON = normal;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vOP; varying vec3 vON;
      uniform sampler2D tF; uniform sampler2D tS; uniform vec4 bF; uniform vec4 bS;
      uniform vec3 bMin; uniform vec3 bMax; uniform vec2 sides; uniform float photo;`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      {
        vec3 n = normalize(vON);
        vec3 p = (vOP - bMin) / (bMax - bMin);
        // front view: camera looks along -Z at the screen side
        float fx = sides.y > 0.0 ? p.x : 1.0 - p.x;
        vec2 uvF = vec2(mix(bF.x, bF.z, fx), mix(bF.y, bF.w, p.y));
        // side view: camera on the +X (or -X) side
        float sz = sides.x > 0.0 ? 1.0 - p.z : p.z;
        vec2 uvS = vec2(mix(bS.x, bS.z, sz), mix(bS.y, bS.w, p.y));
        vec4 cF = texture2D(tF, uvF); vec4 cS = texture2D(tS, uvS);
        float wF = smoothstep(0.35, 0.75, n.z * sides.y);
        float wS = smoothstep(0.35, 0.75, n.x * sides.x); // only the side HIKMICRO photographed; a mirrored copy would flip the logo
        vec3 base = diffuseColor.rgb;
        vec3 col = base;
        col = mix(col, cS.rgb, wS * cS.a);
        col = mix(col, cF.rgb, wF * cF.a);
        diffuseColor.rgb = mix(base, col, photo);
      }`);
};
model.traverse((o) => { if (o.isMesh) { o.material = mat; o.geometry.computeVertexNormals(); } });

// the AI only saw the screen side and the left side, so the lens side came out flat.
// Add the lens there, sized and placed from the HIKMICRO lens-side render.
{
  const w = size.x, h = size.y;
  const lens = new THREE.Group();
  const black = new THREE.MeshPhysicalMaterial({ color: 0x141416, roughness: 0.45, clearcoat: 0.4 });
  const steel = new THREE.MeshStandardMaterial({ color: 0xb9bcc2, metalness: 0.9, roughness: 0.28 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x1a1d24, metalness: 0.6, roughness: 0.08, clearcoat: 1, iridescence: 0.6, iridescenceIOR: 1.8 });
  const R = w * 0.2;
  const add = (geo, m, z) => { const o = new THREE.Mesh(geo, m); o.rotation.x = Math.PI / 2; o.position.z = z; lens.add(o); return o; };
  add(new THREE.CylinderGeometry(R * 1.12, R * 1.18, R * 0.5, 64), black, -R * 0.25);
  add(new THREE.TorusGeometry(R * 0.86, R * 0.1, 16, 64), steel, -R * 0.5).rotation.x = 0;
  add(new THREE.CylinderGeometry(R * 0.78, R * 0.78, R * 0.1, 64), glass, -R * 0.46);
  lens.children[1].rotation.set(0, 0, 0);
  // find the real lens-side surface: cast a ray from behind toward the body
  const ly = box.min.y + h * 0.74 - center.y;
  model.updateMatrixWorld(true);
  const hit = new THREE.Raycaster(new THREE.Vector3(0, ly, -10), new THREE.Vector3(0, 0, 1)).intersectObject(model, true)[0];
  lens.position.set(0, ly, (hit ? hit.point.z : box.min.z - center.z) + R * 0.12);
  pivot.add(lens);
}

// fit camera
const r = size.length() / 2;
camera.position.set(r * 1.0, r * 0.4, r * 3.8);
controls.target.set(0, 0, 0);
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
document.querySelectorAll('[data-look]').forEach((b) => b.addEventListener('click', () => {
  uniforms.photo.value = b.dataset.look === 'photo' ? 1 : 0;
  document.querySelectorAll('[data-look]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
if (q.has('angle')) pivot.rotation.y = Number(q.get('angle')) * Math.PI / 180;
window.__ready = true;
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
